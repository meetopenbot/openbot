# Fly.io template — copy per tenant and set `app` + secrets from your control plane.
# Provision: fly volumes create openbot_data --region ord --size 1

app = "openbot-tenant-example"
primary_region = "ord"

[build]
  dockerfile = "../Dockerfile"

[env]
  OPENBOT_BASE_DIR = "/data/.openbot"
  OPENBOT_CHANNELS_WORKSPACE_DIR = "/data/workspace"
  PORT = "8080"

[mounts]
  source = "openbot_data"
  destination = "/data"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1

  [[http_service.checks]]
    grace_period = "15s"
    interval = "15s"
    method = "GET"
    path = "/api/health"
    timeout = "5s"

[[vm]]
  memory = "1gb"
  cpu_kind = "shared"
  cpus = 1
